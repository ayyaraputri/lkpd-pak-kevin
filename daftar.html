<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Ekskul</title>
</head>
<body>
    <h2>Formulir Pendaftaran Ekskul - RPL </h2>
    
    <form action="#" method="POST">
        <label>Nama Lengkap</label>
        <label>:</label>
        <input type="text" name="nama" placeholder="Ketik namamu di sini!" required><br><br>

        <label>Tanggal Lahir</label>
        <label>:</label>
        <input type="date" name="tanggal" required><br><br>

        <label>Nomor HP/WA</label>
        <label>:</label>
        <input type="number" name="nomor" placeholder="Ketik nomormu di sini!" required><br><br>

        <button type="submit">Kirim</button>
    </form>
</body>
</html>
